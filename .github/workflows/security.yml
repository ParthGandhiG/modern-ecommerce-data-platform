name: repository-hygiene
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental secrets
        run: |
          ! grep -R -nE '(password|secret|api[_-]?key)\s*[:=]\s*["'"'][^"'"']{8,}' . --exclude-dir=.git --exclude='*.md'
